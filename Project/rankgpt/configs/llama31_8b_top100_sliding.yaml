# STRETCH: full top-100 with the sliding window (w=20, s=10), as in the paper.
run_name: llama31-8b-top100-sliding
dataset: scifact
data_path: data/scifact/reranking_data.jsonl
qrels_path: data/scifact/qrels.tsv
output_dir: results
seed: 42
limit_queries: null
pad_to_full_list: true
model:
  name_or_path: /home/cccp/25m2125/VAMSI/models/Llama-3.1-8B-Instruct
  short_name: llama31-8b
  tensor_parallel_size: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.9

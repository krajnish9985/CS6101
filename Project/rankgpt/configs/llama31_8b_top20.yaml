# PRIMARY EXPERIMENT: Llama-3.1-8B-Instruct, single window over BM25 top-20.
run_name: llama31-8b-top20-single
dataset: scifact

data_path: data/scifact/reranking_data.jsonl
qrels_path: data/scifact/qrels.tsv
output_dir: results

seed: 42
limit_queries: null       # null = all queries; set an int for quick tests
pad_to_full_list: true    # keep ranks 21-100 in BM25 order so Recall@100 stays comparable

model:
  name_or_path: /home/cccp/25m2125/VAMSI/models/Llama-3.1-8B-Instruct
  short_name: llama31-8b
  tensor_parallel_size: 1
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  dtype: bfloat16

prompt:
  style: single_turn      # single_turn | short | rankgpt_multiturn
  max_passage_words: 120
  include_title: true

rerank:
  mode: single_window     # single_window | sliding_window
  top_k: 20
  shuffle_candidates: false

generation:
  temperature: 0.0        # greedy; PG is a deterministic task
  max_tokens: 256
